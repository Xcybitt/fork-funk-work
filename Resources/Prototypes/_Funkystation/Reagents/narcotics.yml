# Funky atmos - /tg/ gases
- type: reagent
  id: NitrosylPlasmide
  name: reagent-name-nitrosyl-plasmide
  group: Narcotics
  desc: reagent-desc-nitrosyl-plasmide
  physicalDesc: reagent-physical-desc-translucent
  flavor: sour
  color: "#e1a116"
  metabolisms:
    Respiration:
      effects:
      - !type:Jitter
    Bloodstream:
      effects:
      - !type:Jitter
      - !type:GenericStatusEffect
        key: Stun
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: KnockedDown
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: Drowsiness
        time: 10
        type: Remove
      - !type:GenericStatusEffect
        conditions:
        key: ForcedSleep
        type: Remove
        time: 10
      - !type:HealthChange
        damage:
          types:
            Poison: 0.1
      - !type:ResetNarcolepsy
        conditions:
        - !type:ReagentCondition
          reagent: NitrosylPlasmide
          min: 0.1

- type: reagent
  id: Panaceaum
  name: reagent-name-panaceaum
  group: Narcotics
  desc: reagent-desc-panaceaum
  physicalDesc: reagent-physical-desc-decay
  contrabandSeverity: Syndicate
  flavor: impendingdoom
  color: "#d68676"
  boilingPoint: 212.0
  meltingPoint: 170.0
  worksOnTheDead: true #well if it doesn't, you could just die to cleanse yourself, and that's kinda lame. This chem will RR you now though, but then again... it's 5 minutes of hyperzine+half omni. glory or death. side effect this also works for dead people, but they won't get defibbed so... theoretically still fine. you still need a battlebuddy to get back up after death.
  metabolisms:
    Bloodstream:
      metabolismRate: 0.017 #should calculate to around 5- mins per injection of stim time, unsure if SS14 takes comically long metabolism rates that well(as in 0.0333333-), so not doing the fractional truth of 5 mins. #abnormal number!1!1!!!. #you do however gain like 10- mins per extra stim you take. but like. YOU COULD DO THIS, OR SPEND YOUR MONEY ON SOMETHING LESS FUCKED UP. #this does make this more of an all in strategy, which doesn't sound.. too bad. i do worry that if i don't have a 5u buffer for charcoal to try cleanse, charcoal can actually cleanse. so i guess i'll leave this for now till a problem occurs, as good devs do :godo:
      effects:
      # Main effects
      - !type:MovementSpeedModifier #won't be as speedy once you're outta panaceaum, but you still won't get stunned
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          min: 5
        walkSpeedModifier: 1.25
        sprintSpeedModifier: 1.25
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStimulantsStamina
        time: 3
      - !type:ModifyStatusEffect
        effectProto: StatusEffectStunned
        time: 3.5
        type: Remove
      - !type:ModifyKnockdown
        time: 3.5
        type: Remove
      - !type:ModifyStatusEffect
        effectProto: StatusEffectForcedSleeping
        time: 3
        type: Remove
      - !type:GenericStatusEffect
        key: Adrenaline
        component: IgnoreSlowOnDamage
        time: 3
      # Side effects
      - !type:Jitter
      # OD/UD
      - !type:ModifyBleed
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 5 #your body can't hold blood anymore
        amount: 3
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 5 #your body deteriorates
        damage:
          groups:
            Brute: 2
            Burn: 2
      - !type:HealthChange #extra hard just so you REALLY don't want to OD on this
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          min: 25
        damage:
          groups:
            Brute: 3
            Burn: 3
      # Warnings so you know if you need more panaceaum or you NEED more
      # honestly woulda added some kinda like you're good indicator but that's probably gonna make when you need to take more to be less clear soooo. not doing that.
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 7.5
        type: Local
        probability: 0.08
        messages:
        - panaceaum-effect-longing
        - panaceaum-effect-lagging
        - panaceaum-effect-lethargy
        - panaceaum-effect-headache
        - panaceaum-effect-suboptimal
        - panaceaum-effect-itchy
      - !type:PopupMessage
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 5
        type: Local
        visualType: MediumCaution
        probability: 0.03
        messages:
        - panaceaum-effect-need
        - panaceaum-effect-bloodtaste
        - panaceaum-effect-doom
        - panaceaum-effect-panic
        - panaceaum-effect-tearing
      - !type:Emote
        emote: Scream
        probability: 0.08
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 5
      # Stopgaps to make sure pana doesn't leave your body
      - !type:AdjustReagent #just in case you get hit with charcoal or something #this also implies you can in a fucked up way, keep someone alive to harvest panaceaum.
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 1
        reagent: Panaceaum
        amount: 3
      - !type:AdjustReagent #this should hold for the natural body's processing
        conditions:
        - !type:ReagentCondition
          reagent: Panaceaum
          max: 4
        reagent: Panaceaum
        amount: 0.5
      # Main effects
      - !type:ModifyBleed #you do still bleed so.. you CAN eat and drink to heal your bloodloss, but don't expect saline to help you quick
        amount: -1.5
      - !type:EvenHealthChange # you WILL shrug off any damage given time
        damage:
          Burn: -1
          Brute: -1
          Toxin: -1
          Airloss: -1
      - !type:HealthChange
        conditions:
        - !type:TotalDamageCondition
          min: 95
        damage:
          types:
            Asphyxiation: -2 #get up!!!
      # Side effects
      - !type:ResetNarcolepsy
      - !type:SatiateHunger
        factor: 1
      - !type:SatiateThirst
        factor: 1
      #no chems other than pana will save you now, also no god mixes with this
      - !type:CleanBloodstream
        excluded: Panaceaum
        cleanseRate: 10
